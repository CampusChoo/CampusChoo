services:
  postgres:
    image: postgres:16-alpine
    container_name: campuschoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campuschoo
      POSTGRES_PASSWORD: campuschoo
      POSTGRES_DB: campuschoo
    ports:
      - "5432:5432"
    volumes:
      - campuschoo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuschoo -d campuschoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campuschoo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - campuschoo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campuschoo_pgdata:
  campuschoo_redisdata:
